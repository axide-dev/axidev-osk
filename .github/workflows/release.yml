name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  linux-release:
    name: Build And Upload Signed Release
    runs-on: ubuntu-24.04
    env:
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install release tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: Build signed release assets
        run: |
          test -n "${MINISIGN_SECRET_KEY}"
          umask 077
          printf '%s' "${MINISIGN_SECRET_KEY}" > "${RUNNER_TEMP}/minisign.key"
          python3 build.py linux release \
            --output dist/linux \
            --signing-key "${RUNNER_TEMP}/minisign.key"

      - name: Remove private signing key
        if: always()
        run: rm -f "${RUNNER_TEMP}/minisign.key"

      - name: Upload assets to published release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/linux/release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
